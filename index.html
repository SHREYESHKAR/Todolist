
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="todo-box">

            <div class="header">
                <h1>My Todo List</h1>
                <p>Organize your day, one task at a time!</p>
            </div>

            <!-- Add Task -->
            <div class="input-section">
                <input type="text" id="taskInput"
                    placeholder="Enter your task...">
                <button id="addBtn" onclick="addTask()">
                    + Add Task
                </button>
            </div>

            <!-- Search -->
            <input type="text" id="searchInput"
                class="search-box"
                placeholder="Search your tasks..."
                oninput="displayTasks()">

            <!-- Filters -->
            <div class="filters">
                <button class="filter active"
                    onclick="setFilter('all', this)">All</button>

                <button class="filter"
                    onclick="setFilter('active', this)">Active</button>

                <button class="filter"
                    onclick="setFilter('completed', this)">Completed</button>
            </div>

            <!-- Task List -->
            <div id="taskList"></div>

            <!-- Task Statistics -->
            <div class="statistics">
                <div>
                    <h3 id="totalTasks">0</h3>
                    <p>Total Tasks</p>
                </div>

                <div>
                    <h3 id="completedTasks">0</h3>
                    <p>Completed</p>
                </div>

                <div>
                    <h3 id="pendingTasks">0</h3>
                    <p>Pending</p>
                </div>
            </div>

            <!-- Clear Button -->
            <button class="clear-btn" onclick="clearCompleted()">
                Clear Completed Tasks
            </button>

        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>Designed and Developed by <strong>Shreyeshkar Sekar</strong></p>
        <p>Registration Number: 212224220099</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
